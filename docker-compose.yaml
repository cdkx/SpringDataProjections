services:
  db:
    image: postgres:16-alpine
    container_name: projections-db
    environment:
      POSTGRES_DB: projections
      POSTGRES_USER: projections
      POSTGRES_PASSWORD: projections
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U projections -d projections" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: projections-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/projections
      DB_USERNAME: projections
      DB_PASSWORD: projections
    ports:
      - "8080:8080"

volumes:
  pgdata:
