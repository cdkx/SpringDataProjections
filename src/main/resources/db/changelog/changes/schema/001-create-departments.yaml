databaseChangeLog:

  - changeSet:
      id: 001-create-departments
      author: eremin
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: departments
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
